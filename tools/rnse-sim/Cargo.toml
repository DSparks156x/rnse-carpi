[package]
name = "rnse-sim"
description = "Desktop simulator: virtual RNS-E, cluster DIS and car on a virtual CAN bus, driving the real carpid"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license-file = "../../LICENSE.md"
publish = false

# Its own workspace: slint stays out of the main workspace's CI (`cargo test
# --workspace` on Linux, the aarch64 check) and out of its Cargo.lock.
[workspace]

[dependencies]
carpi-can = { path = "../../crates/carpi-can" }
carpi-signals = { path = "../../crates/carpi-signals" }
carpi-sim = { path = "../../crates/carpi-sim" }
carpi-dis = { path = "../../crates/carpi-dis" }
carpi-proto = { path = "../../crates/carpi-proto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync", "process"] }
slint = "1.18.1"

[dev-dependencies]
carpi-state = { path = "../../crates/carpi-state" }

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media"] }
